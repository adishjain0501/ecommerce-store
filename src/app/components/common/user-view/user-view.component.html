<div class="card" *ngIf="user">
    <div class="card-header">
        User Information
    </div>
    <div class="card-body">
        <div class="img-container text-center">
            <img class="img" [src]="this.userService.getUserImageUrl(this.user.userId)" onerror="this.src='assets/images/default-user-image.jpg'" alt="User Image">
        </div>
        <h3 class="text-center my-2">{{user.name | uppercase}}</h3>
        <div class="table-responsive mt-5">
            <table class="table table-bordered table-hover">
                <tbody>
                    <tr>
                        <td  class="fw-bold">
                            USER ID
                        </td>
                        <td>
                            {{user.userId}}
                        </td>
                    </tr>
                    <tr>
                        <td class="fw-bold">NAME</td>
                        <td>{{user.name}}</td>
                    </tr>
                    <tr>
                        <td class="fw-bold">EMAIL</td>
                        <td>{{user.email}}</td>
                    </tr>
                    <tr>
                        <td class="fw-bold">GENDER</td>
                        <td>{{user.gender}}</td>
                    </tr>
                    <tr>
                        <td class="fw-bold">ABOUT</td>
                        <td>{{user.about}}</td>
                    </tr>
                    <tr>
                        <td class="fw-bold">ROLE</td>
                        <td><span *ngFor="let role of user.roles">
                            <span class="badge rounded-pill ms-2" [ngClass]="{'text-bg-primary': role.roleName=='ROLE_NORMAL','text-bg-success':role.roleName=='ROLE_ADMIN'}">{{role.roleName}}</span>
                        </span></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
