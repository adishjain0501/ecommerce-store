<div *ngIf="product" class="card h-100 shadow-sm border" [ngClass]="{
    'border-danger': !product.stock,
    'border-success': product.stock,
    'text-danger': !product.stock
}">
    <div class="card-body">
        <div class="image-container text-center">
            <img [src]="productService.getProductImageUrl(product.productId)" [alt]="product.title" >
        </div>
        <h4 class="mt-3">{{product.title}}</h4>
        <p>Lorem ipsum dolor sit amet consectetur, adipisicing elit. Labore nisi quasi rerum quia! Pariatur, id.</p>
        
        
</div>
<div class="px-3 row">
    <!-- price and discounted price -->
    <p class="fs-4 fw-bold text-muted">
        <span>Price:</span> 
        <span class="text-decoration-line-through">{{ product.price | currency:'INR':'symbol'}}</span>
        <span class="ms-2 text-success">{{ product.discountedPrice | currency:'INR':'symbol'}}</span>
    </p>
    <button class="btn" 
    [ngClass]="{'btn-primary': product.stock,'btn-danger':!product.stock}" (click)="addToCartRequest(product)">{{product.stock ? 'Add to Cart':'Out of Stock'}}</button>
    <button [routerLink]="['/product',product.productId]" class="btn btn-warning my-2">View</button>
</div>
</div>
