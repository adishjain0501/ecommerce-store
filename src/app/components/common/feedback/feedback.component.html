<div class="container mt-5">
    <h2 class="mb-4 text-center">Feedback Form</h2>
    <form (ngSubmit)="onSubmit()">
        <!-- Name Field -->
        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" class="form-control" [(ngModel)]="feedback.name" name="name" required>
          </div>
        
        <!-- Email Field -->
        <div class="mb-3">
            <label class="form-label">Email</label>
            <input type="email" class="form-control" [(ngModel)]="feedback.email" name="email" required>
          </div>
        
          <div class="mb-3">
            <label class="form-label">Phone</label>
            <input type="tel" class="form-control" [(ngModel)]="feedback.phoneNo" name="phone" required>
          </div>
        
          <div class="mb-3">
            <label class="form-label">Feedback</label>
            <textarea class="form-control" [(ngModel)]="feedback.feedback" name="feedback" rows="4" required></textarea>
          </div>
        
        <!-- Image Upload Field -->
        <div class="mb-3">
            <label class="form-label">Upload Image</label>
            <input type="file" class="form-control" (change)="onFileSelected($event)" accept="image/*">
          </div>
        <!-- Image Preview Section -->
        <div *ngIf="imagePreview" class="mb-3 text-center">
            <label class="form-label">Image Preview:</label>
            <img [src]="imagePreview" alt="Image Preview" class="img-thumbnail" style="max-width: 300px; margin-top: 10px;">
        </div>
        <!-- Submit Button -->
        <button type="submit" class="btn btn-primary w-100">Submit Feedback</button>
    </form>
</div>
