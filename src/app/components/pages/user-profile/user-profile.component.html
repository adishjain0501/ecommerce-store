<div class="container">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <app-user-view [user]="user"></app-user-view>
            <div class="row mx-1 my-2" *ngIf="user">
                <button class="btn btn-outline-primary" (click)="openUpdateModal(updateUserProfileContent)">Update</button>
            </div>
        </div>
    </div>
</div>

<ng-template #updateUserProfileContent let-modal>
    <div class="modal-header">
        <h4 class="modal-title" id="modal-basic-title">{{user?.name | uppercase}}</h4>
        <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss('Cross click')"></button>
    </div>
    <div class="modal-body" *ngIf="user">
        <!-- {{user | json}} -->
        <div class="container mt-1">
            <h2 class="mb-4">Update Profile</h2>
            <form (ngSubmit)="updateFormSubmitted($event)">
                <!-- Username Field -->
                <div class="mb-3">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" required [(ngModel)]="user.name">
                </div>
    
                <!-- Gender Field -->
                <div class="mb-3">
                    <label for="gender" class="form-label">Gender</label>
                    <select class="form-select" id="gender" name="gender" required [(ngModel)]="user.gender">
                        <option value="">Select your gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
    
                <!-- About Field -->
                <div class="mb-3">
                    <label for="about" class="form-label">About</label>
                    <textarea class="form-control" id="about" name="about" rows="4" placeholder="Tell us something about yourself" [(ngModel)]="user.about"></textarea>
                </div>
    
                <!-- Password Field -->
                <div class="mb-3">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" placeholder="Enter your new password" required [(ngModel)]="user.password">
                </div>
    
                <!-- Image Upload Field -->
                <div class="mb-3">
                    <div class="preview-container text-center">
                        <img style="height:250px;width:auto;" [src]="previewImageUrl" alt="" >
                    </div>
                    <label for="image" class="form-label">Profile Picture</label>
                    <input #productImageInput class="form-control" type="file" name="profile-image" id="profile-image" (change)="imageFieldChanged($event)">
                </div>
    
                <!-- Submit Button -->
                 <div class="container text-center">
                    <button type="submit" class="btn btn-primary">Update</button>
                 </div>
                
            </form>
        </div>
    </div>
    <!-- <div class="modal-footer">
		<button type="button" class="btn btn-outline-secondary" (click)="modal.close('Save click')">Save</button>
	</div> -->
</ng-template>
