<div class="container-fluid">
    <div class="row">
        <div class="col-md-8 offset-2">
            <div class="card shadow-sm">
                <div class="card-body" *ngIf="cart">
                    <h3>Cart Items ({{cart.items.length}})</h3>
                    <div class="mt-4">
                        <app-cart-item [cartItem]="item" (itemIncreaseQuantityEvent)="increaseQuantity($event)" (itemDecreaseQuantityEvent)="decreaseQuantity($event)" (itemDeleteEvent)="deleteItem($event)" *ngFor="let item of cart.items"></app-cart-item>
                    </div>
                    <div class="mt-3 text-center" *ngIf="cart.items.length > 0">
                        <h3 class="text-center mb-2">Total Price: {{ cartService.getTotalPriceOfCart(cart.items) | currency:'INR':'symbol'}}</h3>
                        <br>
                        <button class="btn btn-success btn-lg" (click)="openOrderPlaceModal(orderContent)">Place Order</button>
                        <button (click)="clearCart()" class="btn btn-danger btn-lg ms-2">Clear Cart</button>
                    </div>
                    
                    <div class="mt-3 text-center alert alert-danger" *ngIf="cart.items.length == 0">
                        <h3>No items in cart</h3>
                        <button [routerLink]="['/store']" routerLinkActive="router-link-active"  class="btn btn-primary">Add Items to Cart</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- order modal -->
<ng-template #orderContent let-modal>
    <div class="modal-header">
        <h4 class="modal-title" id="modal-basic-title">Fill order detail</h4>
        <button type="button" class="btn-close" aria-label="Close" (click)="modal.dismiss('Cross click')"></button>
    </div>
    <div class="modal-body">
        
            <form id="categoryForm" (ngSubmit)="createOrderFormSubmitted($event)">
                
                <div class="my-2">
                    <label for="billingName">Billing Name</label>
                    <input [(ngModel)]="orderRequest!.billingName" placeholder="Enter here..." type="text" name="billingName" class="form-control" id="billingName">
                </div>
                <div class="my-2">
                    <label for="billingPhone">Billing Phone</label>
                    <input [(ngModel)]="orderRequest!.billingPhone" placeholder="Enter here..." type="text" name="billingPhone" class="form-control" id="billingPhone">
                </div>
                <div class="my-2">
                    <label for="billingAddress">Billing Address</label>
                    <textarea [(ngModel)]="orderRequest!.billingAddress" placeholder="Enter here..." name="billingAddress" class="form-control" id="billingAddress" rows="6"></textarea>
                </div>
                <div class="container text-center my-3">
                    <button type="submit" class="btn btn-primary btn-lg">Create Order</button>
                </div>
              </form>
         
    </div>
    
</ng-template>
