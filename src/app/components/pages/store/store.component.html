<div class="row mx-4 my-3">
    <div class="col-md-2">
        <div class="mt-3">
            <app-categories-view></app-categories-view>
        </div>
    </div>
    <div class="col-md-10">
        <form class="search-field-container input-group" (ngSubmit)="searchProduct()">
            <input type="text" name="search" placeholder="Search here..." id="search" class="form-control rounded-0"
                [(ngModel)]="searchQuery" (keyup)="restoreOldData()">
            <button type="submit" class="btn btn-outline-secondary rounded-0">Search</button>
        </form>
        <!-- show products -->
         <div class="row gx-2 align-items-stretch" infiniteScroll [infiniteScrollDistance]="2"  [infiniteScrollThrottle]="200" (scrolled)="onScroll($event)" *ngIf="productsResponse">
            <div [ngClass]="{'text-danger':!product.stock,'border-danger':!product.stock}" class="col-xl-4 col-lg-4 col-md-6 mt-3" *ngFor="let product of productsResponse.content">
                <app-single-product-card [product]="product"></app-single-product-card>
            </div>
        </div>
</div>
